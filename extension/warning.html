<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Blocked by Nyavu</title>
<style>
  body { margin:0; min-height:100vh; display:grid; place-items:center;
         background:radial-gradient(900px 500px at 70% -10%, rgba(242,84,91,.18), transparent 60%), #0a1020;
         color:#e8eefb; font:16px/1.6 -apple-system,"Segoe UI",Roboto,sans-serif; }
  .card { max-width:560px; padding:40px; background:#121d33; border:1px solid #22304d;
          border-radius:16px; box-shadow:0 24px 60px -30px #000; }
  .tag { display:inline-block; padding:4px 12px; border-radius:999px; font-size:12px;
         font-weight:700; letter-spacing:.08em; text-transform:uppercase;
         background:rgba(242,84,91,.15); color:#ff8a90; margin-bottom:16px; }
  h1 { font-size:24px; margin:0 0 10px; letter-spacing:-.02em; }
  .host { font:13px ui-monospace,Consolas,monospace; color:#93a6c4; word-break:break-all; margin:0 0 20px; }
  ul { color:#93a6c4; font-size:14px; padding-left:18px; }
  .actions { display:flex; gap:12px; margin-top:26px; flex-wrap:wrap; }
  button, a.btn { padding:11px 20px; border-radius:10px; border:1px solid #2c3d5e; background:#16233d;
          color:#e8eefb; font-weight:600; cursor:pointer; text-decoration:none; font-size:14px; }
  button.primary { background:linear-gradient(180deg,#4cc2f7,#2a9fdc); color:#04121f; border-color:#63c9f8; }
  .note { margin-top:18px; font-size:12px; color:#64789a; }
</style>
</head>
<body>
<div class="card">
  <span class="tag">Blocked</span>
  <h1>This page was blocked</h1>
  <p class="host" id="host"></p>
  <p style="color:#93a6c4;margin:0 0 12px" id="score"></p>
  <ul id="reasons"></ul>
  <div class="actions">
    <button class="primary" id="back">Go back</button>
    <button id="proceed">Continue anyway</button>
  </div>
  <p class="note">A verdict is an assessment from a statistical model, not a guarantee. If you
     believe this site is genuine, continue and then trust the host from the Nyavu toolbar button.</p>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById("host").textContent = q.get("host") || "unknown host";
  const score = q.get("score");
  if (score) document.getElementById("score").textContent = `Risk score: ${score}%`;
  try {
    const reasons = JSON.parse(q.get("reasons") || "[]");
    document.getElementById("reasons").innerHTML = reasons
      .map(r => `<li>${String(r).replace(/[<>&]/g, c => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c]))}</li>`)
      .join("");
  } catch { /* no reasons passed */ }

  document.getElementById("back").onclick = () => history.length > 1 ? history.back() : window.close();
  document.getElementById("proceed").onclick = () => {
    const host = q.get("host");
    if (host) location.replace(`https://${host}`);
  };
</script>
</body>
</html>
