# Render blueprint for Nyavu.
#
# Render builds this straight from the repository - no Docker, no CLI, no region
# allow-list. "New > Blueprint" and it reads this file.
services:
  - type: web
    name: nyavu
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: NYAVU_COOKIE_SECURE
        value: "1"
      # Storage is Postgres (Neon), supplied as DATABASE_URL in the dashboard - not in
      # this file, because it contains a password. When DATABASE_URL is set, the
      # service uses Postgres and the SQLite path below is ignored, so accounts and
      # scan history survive a redeploy. The path is only a local-development fallback.
      - key: NYAVU_DB_PATH
        value: /tmp/nyavu.db
